name: Test with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          path: myrepo
      - id: action
        uses: .
        with:
          working-directory: myrepo
          filters: |
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            any:
              - '**'
        continue-on-error: true
      - name: Assert action ran with working-directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working-directory input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail due to sentinel repo or working-directory resolution)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test list-files csv output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: filter
        uses: .
        continue-on-error: true
        with:
          base: HEAD
          list-files: csv
          filters: |
            action:
              - 'action/**'
            tests:
              - 'tests/**'

      - name: Assert action ran with list-files csv
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          ACTION_MATCHED: ${{ steps.filter.outputs.action }}
          ACTION_FILES: ${{ steps.filter.outputs.action_files }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          echo "action matched: $ACTION_MATCHED"
          echo "action_files: $ACTION_FILES"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHANGES" ]; then
              echo "FAIL: action succeeded but changes output is empty"
              exit 1
            fi
            # Validate changes is a JSON array
            if ! echo "$CHANGES" | grep -qE '^\['; then
              echo "FAIL: changes output is not a JSON array: $CHANGES"
              exit 1
            fi
            # When base=HEAD, no changes expected
            if [ "$CHANGES" = "[]" ]; then
              echo "INFO: no changes detected (HEAD vs HEAD) - correct"
              # With no changes, action_files should be empty or not set
              if [ -n "$ACTION_FILES" ]; then
                echo "FAIL: expected no action_files when no changes, got: $ACTION_FILES"
                exit 1
              fi
            else
              echo "INFO: changes detected: $CHANGES"
              # If action matched, action_files should be CSV format (no leading '[')
              if [ "$ACTION_MATCHED" = "true" ] && [ -n "$ACTION_FILES" ]; then
                if echo "$ACTION_FILES" | grep -qE '^\['; then
                  echo "FAIL: action_files should be CSV format, not JSON array: $ACTION_FILES"
                  exit 1
                fi
              fi
            fi
            echo "PASS: action succeeded with list-files=csv, changes=$CHANGES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

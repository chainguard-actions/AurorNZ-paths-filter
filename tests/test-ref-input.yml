name: Test ref input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          ref: act-harness
          base: act-harness
          filters: |
            src:
              - '**/*.yml'
              - '**/*.yaml'
            docs:
              - '**/*.md'
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ref input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail gracefully when ref equals base)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

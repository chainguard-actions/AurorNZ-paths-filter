name: Test with explicit base ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a test commit to compare against
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a temporary file and commit it so we have something to compare
          echo "test content" > /tmp/test-marker.txt
          # We'll use HEAD as base - comparing HEAD to HEAD means no changes
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"

      - id: filter
        uses: .
        continue-on-error: true
        with:
          base: HEAD
          filters: |
            action:
              - 'action/**'
            tests:
              - 'tests/**'

      - name: Assert action ran with explicit base
        env:
          OUTCOME: ${{ steps.filter.outcome }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          ACTION_MATCHED: ${{ steps.filter.outputs.action }}
          TESTS_MATCHED: ${{ steps.filter.outputs.tests }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          echo "action matched: $ACTION_MATCHED"
          echo "tests matched: $TESTS_MATCHED"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHANGES" ]; then
              echo "FAIL: action succeeded but changes output is empty"
              exit 1
            fi
            # Validate changes is a JSON array
            if ! echo "$CHANGES" | grep -qE '^\['; then
              echo "FAIL: changes output is not a JSON array: $CHANGES"
              exit 1
            fi
            # When comparing HEAD to HEAD, no filters should match
            if [ "$CHANGES" != "[]" ]; then
              echo "INFO: changes detected (may be expected): $CHANGES"
            else
              echo "INFO: no changes detected (HEAD vs HEAD)"
            fi
            echo "PASS: action succeeded with explicit base, changes=$CHANGES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
